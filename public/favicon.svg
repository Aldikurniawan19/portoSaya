<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Glow Filter for Pink Dot -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="140" fill="url(#bg-grad)" />
  
  <!-- Outer Glow / Accent Ring -->
  <rect x="14" y="14" width="484" height="484" rx="126" fill="none" stroke="url(#border-grad)" stroke-width="14" stroke-opacity="0.85" />

  <!-- Subtle Code Bracket Accents -->
  <path d="M75 210L40 256L75 302" stroke="#3b82f6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.3" />
  <path d="M437 210L472 256L437 302" stroke="#ec4899" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.3" />

  <!-- Text "All" -->
  <text x="110" y="328" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="210" fill="url(#text-grad)" letter-spacing="-6">All</text>

  <!-- Glowing Signature Pink Dot "." -->
  <circle cx="395" cy="308" r="28" fill="#ec4899" filter="url(#glow)" />
</svg>
